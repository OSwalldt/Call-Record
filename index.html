<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon_v10.svg">
<title>Запись звонка</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 22px; font: 14px "Segoe UI", Arial, sans-serif; background: #f3f5f8; color: #20242a; }
  .app { max-width: 760px; margin: 0 auto; background: #fff; border: 1px solid #dce1e7; border-radius: 10px; padding: 22px; box-shadow: 0 3px 14px #0000000a; }
  h1 { font-size: 20px; margin: 0 0 20px; }
  label { display: block; font-weight: 600; margin: 0 0 7px; }
  .field { margin-bottom: 15px; }
  .name-row { display: grid; grid-template-columns: minmax(0, 13fr) minmax(105px, 7fr); gap: 12px; }
  input, textarea { width: 100%; border: 1px solid #cbd2dc; border-radius: 6px; padding: 9px 10px; font: inherit; background: #fff; }
  textarea { min-height: 90px; resize: vertical; }
  .input-copy { display: flex; gap: 6px; }
  .input-copy input, .input-copy textarea { min-width: 0; }
  button { border: 1px solid #cbd2dc; background: #f7f8fa; border-radius: 6px; padding: 8px 11px; cursor: pointer; font: inherit; }
  button:hover { background: #edf1f6; }
  .primary { background: #1769aa; border-color: #1769aa; color: white; }
  .primary:hover { background: #12598f; }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  h2 { font-size: 16px; margin: 24px 0 12px; }
  .history-item { position: relative; border: 1px solid #e0e5eb; border-radius: 7px; padding: 12px; margin-bottom: 9px; }
  .history-meta { color: #687384; font-size: 12px; margin-bottom: 7px; padding-right: 145px; }
  .history-text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .history-actions { display: flex; gap: 7px; margin-top: 10px; }
  .history-toggles { position: absolute; top: 9px; right: 12px; width: 112px; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
  .history-toggle { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 12px; font-weight: 400; cursor: pointer; white-space: nowrap; }
  .history-toggle input { width: 15px; height: 15px; margin: 0; cursor: pointer; }
  .history-item.completed { border-color: #b8c8bc; }
  .history-item.completed .history-text { color: #687384; }
  .empty { color: #758091; }
  .history-clear { margin-top: 14px; }
  .danger { background: #c93636; border-color: #c93636; color: #fff; }
  .danger:hover { background: #aa2929; }
  .clear-confirm { margin-top: 10px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .clear-confirm[hidden] { display: none; }
  @media (max-width: 480px) {
    body { padding: 10px; }
    .app { padding: 15px; }
    .name-row { grid-template-columns: minmax(0, 17fr) minmax(105px, 13fr); gap: 8px; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>Запись звонка</h1>
  <form id="callForm" autocomplete="off">
    <div class="field">
      <label for="organization">Организация</label>
      <div class="input-copy">
        <input id="organization" autocomplete="off" placeholder="Название организации">
        <button type="button" data-copy="organization" title="Копировать" tabindex="-1">⧉</button>
      </div>
    </div>
    <div class="name-row field">
      <div>
        <label for="clientName">Имя</label>
        <div class="input-copy">
          <input id="clientName" autocomplete="off" placeholder="Имя клиента">
          <button type="button" data-copy="clientName" title="Копировать" tabindex="-1">⧉</button>
        </div>
      </div>
      <div>
        <label for="lastDigits">Номер</label>
        <div class="input-copy">
          <input id="lastDigits" autocomplete="off" inputmode="numeric" maxlength="4" placeholder="1234">
          <button type="button" data-copy="lastDigits" title="Копировать" tabindex="-1">⧉</button>
        </div>
      </div>
    </div>
    <div class="field">
      <label for="problem">Суть проблемы</label>
      <div class="input-copy">
        <textarea id="problem" autocomplete="off" placeholder="Кратко опишите обращение"></textarea>
        <button type="button" data-copy="problem" title="Копировать" tabindex="-1">⧉</button>
      </div>
    </div>
    <div class="actions">
      <button class="primary" type="submit" id="submitButton">Сохранить заявку</button>
      <button type="button" id="cancelEdit" hidden>Отмена</button>
      <button type="button" id="copyAll">Копировать всё</button>
      <button type="button" id="clearForm">Очистить поля</button>
    </div>
  </form>

  <h2>История заявок</h2>
  <div id="history"></div>
  <div class="history-clear">
    <button type="button" id="clearHistory" class="danger">Удалить историю заявок</button>
    <div id="clearConfirm" class="clear-confirm" hidden>
      <span>Точно удалить историю заявок?</span>
      <button type="button" id="confirmClearHistory" class="danger">ДА</button>
      <button type="button" id="cancelClearHistory">НЕТ</button>
    </div>
  </div>
</div>
<script>
const STORAGE_KEY = 'call_requests_v2';
const fields = ['organization', 'clientName', 'lastDigits', 'problem'];
let editingId = null;
const $ = id => document.getElementById(id);
const value = id => $(id).value.trim();
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (_) {
    const helper = document.createElement('textarea');
    helper.value = text;
    document.body.appendChild(helper);
    helper.select();
    document.execCommand('copy');
    helper.remove();
  }
}

document.querySelectorAll('[data-copy]').forEach(button => {
  button.addEventListener('click', () => copyText(value(button.dataset.copy)));
});
$('lastDigits').addEventListener('input', event => {
  event.target.value = event.target.value.replace(/\D/g, '').slice(0, 4);
});
function loadItems() {
  try {
    const items = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    if (!Array.isArray(items)) return [];
    let changed = false;
    items.forEach(item => {
      if (!item.id) {
        item.id = 'request-' + Date.now() + '-' + Math.random().toString(16).slice(2);
        changed = true;
      }
      if (typeof item.completed !== 'boolean') {
        item.completed = false;
        changed = true;
      }
      if (typeof item.includeTime !== 'boolean') {
        item.includeTime = false;
        changed = true;
      }
      if (!item.completed && item.includeTime) {
        item.includeTime = false;
        changed = true;
      }
      if (!Object.prototype.hasOwnProperty.call(item, 'completedAt')) {
        item.completedAt = null;
        changed = true;
      }
    });
    if (changed) saveItems(items);
    return items;
  } catch (_) { return []; }
}
function saveItems(items) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}

function formatItem(item) {
  return [
    'Организация: ' + (item.organization || ''),
    'Имя: ' + (item.clientName || ''),
    'Номер: ' + (item.lastDigits || ''),
    'Суть проблемы: ' + (item.problem || '')
  ].join('\n');
}

function parseCreatedDate(dateText) {
  const match = String(dateText || '').match(/^(\d{1,2})\.(\d{1,2})\.(\d{4}),?\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (!match) return null;
  const [, day, month, year, hour, minute, second = '0'] = match;
  const date = new Date(Number(year), Number(month) - 1, Number(day), Number(hour), Number(minute), Number(second));
  return Number.isNaN(date.getTime()) ? null : date;
}
function formatClock(date) {
  return String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
}
function formatHistoryMeta(item) {
  const created = parseCreatedDate(item.date);
  const parts = [];
  if (item.lastDigits) parts.push(item.lastDigits);
  if (created) parts.push(
    String(created.getDate()).padStart(2, '0') + '.' +
    String(created.getMonth() + 1).padStart(2, '0') + '.' +
    created.getFullYear() + ', ' + formatClock(created)
  );
  else if (item.date) parts.push(item.date);
  let result = parts.join(' · ');
  if (item.includeTime && item.completed && item.completedAt && created) {
    const completedAt = new Date(item.completedAt);
    if (!Number.isNaN(completedAt.getTime())) {
      const elapsed = Math.max(0, completedAt.getTime() - created.getTime());
      const totalMinutes = Math.floor(elapsed / 60000);
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;
      result += ' - ' + formatClock(completedAt) + ' = ' +
        String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0');
    }
  }
  return result;
}

function renderHistory() {
  const host = $('history');
  const items = loadItems();
  host.innerHTML = '';
  $('clearHistory').disabled = items.length === 0;
  if (!items.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Сохранённых заявок пока нет.';
    host.appendChild(empty);
    return;
  }

  items.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'history-item' + (item.completed ? ' completed' : '');

    const toggles = document.createElement('div');
    toggles.className = 'history-toggles';

    const completionLabel = document.createElement('label');
    completionLabel.className = 'history-toggle';
    const completion = document.createElement('input');
    completion.type = 'checkbox';
    completion.checked = !!item.completed;
    completion.setAttribute('aria-label', 'Заявка выполнена');
    completion.addEventListener('change', () => {
      const current = loadItems();
      const target = current.find(entry => entry.id === item.id);
      if (!target) return;
      target.completed = completion.checked;
      target.completedAt = completion.checked ? new Date().toISOString() : null;
      if (!completion.checked) target.includeTime = false;
      saveItems(current);
      renderHistory();
    });
    const completionText = document.createElement('span');
    completionText.textContent = 'Выполнено';
    completionLabel.append(completion, completionText);

    toggles.append(completionLabel);

    if (item.completed) {
      const includeTimeLabel = document.createElement('label');
      includeTimeLabel.className = 'history-toggle';
      const includeTime = document.createElement('input');
      includeTime.type = 'checkbox';
      includeTime.checked = !!item.includeTime;
      includeTime.setAttribute('aria-label', 'Учесть время');
      includeTime.addEventListener('change', () => {
        const current = loadItems();
        const target = current.find(entry => entry.id === item.id);
        if (!target || !target.completed) return;
        target.includeTime = includeTime.checked;
        saveItems(current);
        renderHistory();
      });
      const includeTimeText = document.createElement('span');
      includeTimeText.textContent = 'Учесть время';
      includeTimeLabel.append(includeTime, includeTimeText);
      toggles.appendChild(includeTimeLabel);
    }

    const meta = document.createElement('div');
    meta.className = 'history-meta';
    meta.textContent = formatHistoryMeta(item);
    const content = document.createElement('div');
    content.className = 'history-text';
    content.textContent = formatItem(item);

    const actions = document.createElement('div');
    actions.className = 'history-actions';

    const edit = document.createElement('button');
    edit.textContent = 'Редактировать';
    edit.addEventListener('click', () => startEdit(item));
    const copy = document.createElement('button');
    copy.textContent = 'Копировать заявку';
    copy.addEventListener('click', () => copyText(formatItem(item)));

    const remove = document.createElement('button');
    remove.textContent = 'Удалить';
    remove.addEventListener('click', () => {
      const current = loadItems();
      current.splice(index, 1);
      saveItems(current);
      renderHistory();
    });
    actions.append(edit, copy, remove);
    card.append(toggles, meta, content, actions);
    host.appendChild(card);
  });
}

function setEditMode(item) {
  editingId = item ? item.id : null;
  $('submitButton').textContent = item ? 'Сохранить изменения' : 'Сохранить заявку';
  $('cancelEdit').hidden = !item;
}

function startEdit(item) {
  fields.forEach(id => $(id).value = item[id] || '');
  setEditMode(item);
  $('organization').focus();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function cancelEdit() {
  setEditMode(null);
  fields.forEach(id => $(id).value = '');
}

$('callForm').addEventListener('submit', event => {
  event.preventDefault();
  const data = {
    organization: value('organization'),
    clientName: value('clientName'),
    lastDigits: value('lastDigits'),
    problem: value('problem')
  };

  if (!data.organization && !data.clientName && !data.lastDigits && !data.problem) return;
  const items = loadItems();
  if (editingId) {
    const index = items.findIndex(item => item.id === editingId);
    if (index !== -1) items[index] = { ...items[index], ...data };
    else {
      items.unshift({ ...data, completed: false, completedAt: null, includeTime: false, date: new Date().toLocaleString('ru-RU') });
    }
  } else {
    items.unshift({ ...data, completed: false, completedAt: null, includeTime: false, date: new Date().toLocaleString('ru-RU') });
  }

  saveItems(items);
  cancelEdit();
  renderHistory();
});

$('cancelEdit').addEventListener('click', cancelEdit);
$('clearHistory').addEventListener('click', () => {
  $('clearConfirm').hidden = false;
  $('clearHistory').hidden = true;
});
$('cancelClearHistory').addEventListener('click', () => {
  $('clearConfirm').hidden = true;
  $('clearHistory').hidden = false;
});
$('confirmClearHistory').addEventListener('click', () => {
  saveItems([]);
  // Сохраняем текущие значения формы, но завершаем режим редактирования удалённой заявки.
  setEditMode(null);
  $('clearConfirm').hidden = true;
  $('clearHistory').hidden = false;
  renderHistory();
});
$('copyAll').addEventListener('click', () => {
  copyText(formatItem({
    organization: value('organization'),
    clientName: value('clientName'),
    lastDigits: value('lastDigits'),
    problem: value('problem')
  }));
});

$('clearForm').addEventListener('click', () => {
  fields.forEach(id => $(id).value = '');
});

renderHistory();
</script>
</body>
</html>
